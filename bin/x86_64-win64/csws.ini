[APPLICATION]
;; Web access port
PORT=8880
;; Path to templates HTML files
RootPath=.\var_thtml\
;; name of default HTML-template
RootFileName=index.thtml
;; Temporary catalog
TempPath=.\workdir\

[MENU1]
MenuCaption=CAN-Utils
MenuCommand=/can-utils/setmenu2

[MENU2]
MenuCaption=WiFi
MenuCommand=/wifi/setmenu2

[MENU3]
